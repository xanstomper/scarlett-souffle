title: "Protected route with empty credential material"
id: "66b40647-1d32-4b10-aeb6-2ed3f936dcc7"
status: "experimental"
description: "Mirrored from confirmed attack: authentication bypass (attack ref: http://10.0.0.23:2869/upnphost/udhisapi.dll?control=uuid:b0b712e4-7a75-436b-9373-b24e61bb0daa+urn:upnp-org:serviceId:RenderingControl; match: protected route answers 200 with empty/forged credential)."
logsource:
    service: "auth"
detection:
    uri_re: "/(api|admin|account)/"
    cred_empty: true
    status: 200
    condition: "sel"
falsepositives:
    - "health endpoints"
    - "public marketing routes"
level: "critical"
tags:
    - "attack.t1550"
